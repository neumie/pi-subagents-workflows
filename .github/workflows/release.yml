name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  provider-artifact:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.36.0
            sha256: fc6550f62eedf6d19fab2917ffda71d68929b31e3d7be24eb58acfdc44a23cc2
          - version: 0.37.0
            sha256: aefadd1e6fe8375d551b8e29fea5e5a5861c92a08dd1d6a96c7d0c00082e3ae7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Download and verify pi-subagents ${{ matrix.version }}
        run: node test/download-provider-artifact.mjs
        env:
          PI_SUBAGENTS_VERSION: ${{ matrix.version }}
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.sha256 }}
      - run: npm run test:provider-artifact
        env:
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.sha256 }}
      - run: npm run test:provider-extension-e2e
        env:
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.sha256 }}

  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: provider-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
