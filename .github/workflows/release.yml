name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-source:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify immutable default-branch release source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          test "$tag_sha" = "$RELEASE_SHA"
          test "$head_sha" = "$RELEASE_SHA"
          git merge-base --is-ancestor \
            "$RELEASE_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}"

  provider-artifact:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: release-source
    name: provider-artifact (${{ matrix.os }}, Pi ${{ matrix.pi-version }}, pi-subagents ${{ matrix.provider.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pi-version: ["0.81.0", "0.82.1", "0.83.0"]
        provider:
          - version: "0.36.0"
            sha256: fc6550f62eedf6d19fab2917ffda71d68929b31e3d7be24eb58acfdc44a23cc2
          - version: "0.37.0"
            sha256: aefadd1e6fe8375d551b8e29fea5e5a5861c92a08dd1d6a96c7d0c00082e3ae7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Download and verify pi-subagents ${{ matrix.provider.version }}
        run: node test/download-provider-artifact.mjs
        env:
          PI_SUBAGENTS_VERSION: ${{ matrix.provider.version }}
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.provider.sha256 }}
      - run: npm run test:provider-artifact
        env:
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.provider.sha256 }}
      - run: npm run test:provider-extension-e2e
        env:
          PI_CODING_AGENT_VERSION: ${{ matrix.pi-version }}
          PI_SUBAGENTS_TARBALL: ${{ runner.temp }}/pi-subagents.tgz
          PI_SUBAGENTS_TARBALL_SHA256: ${{ matrix.provider.sha256 }}

  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: [release-source, provider-artifact]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run pack:check
      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
